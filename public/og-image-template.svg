<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1917;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252422;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="#FF4D05" />

  <!-- Grid lines (subtle) -->
  <line x1="80" y1="0" x2="80" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="1120" y1="0" x2="1120" y2="630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="550" x2="1200" y2="550" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Tag / Label -->
  <rect x="80" y="140" width="220" height="36" fill="none" stroke="#FF4D05" stroke-width="1.5"/>
  <text x="96" y="164" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#FF4D05" text-anchor="start">HEADHUNTING · ZÜRICH</text>

  <!-- Main headline -->
  <text x="80" y="270" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="300" letter-spacing="-2" fill="#ffffff" text-anchor="start">ScaleZ</text>

  <!-- Sub headline -->
  <text x="80" y="340" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="300" letter-spacing="-0.5" fill="#ffffff" text-anchor="start">Executive Search &amp;</text>
  <text x="80" y="385" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="300" letter-spacing="-0.5" fill="#FF4D05" text-anchor="start">Personalvermittlung</text>

  <!-- Tagline -->
  <text x="80" y="450" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="300" fill="#999997" text-anchor="start">Direkt. Diskret. Ergebnisorientiert.</text>

  <!-- Website -->
  <text x="80" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" letter-spacing="1" fill="#666664" text-anchor="start">www.scale-z.ch</text>

  <!-- Right side decoration -->
  <rect x="900" y="200" width="1" height="230" fill="#FF4D05" opacity="0.6"/>
  <text x="930" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#666664" text-anchor="start">91%</text>
  <text x="930" y="278" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555553" text-anchor="start">Besetzungsquote</text>
  <text x="930" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#666664" text-anchor="start">&lt;25</text>
  <text x="930" y="338" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555553" text-anchor="start">Tage im Schnitt</text>
  <text x="930" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#666664" text-anchor="start">DACH</text>
  <text x="930" y="398" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555553" text-anchor="start">Region</text>
</svg>
